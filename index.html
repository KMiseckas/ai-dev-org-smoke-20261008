<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>Development harness verification</title>
<style>body{font:18px system-ui;background:#eff4f8;color:#17324d;margin:0;padding:clamp(20px,5vw,80px)}main{max-width:640px;margin:auto;background:white;padding:32px;border-radius:16px}label,input,button{display:block;margin:14px 0}input{font:inherit;box-sizing:border-box;width:100%;padding:12px;border:1px solid #456078;border-radius:8px}button{font:inherit;padding:12px 24px;background:#174e79;color:white;border:0;border-radius:8px}h1{font-size:clamp(24px,5vw,36px)}#result{font-weight:700;font-size:24px;overflow-wrap:anywhere}</style></head>
<body><main><p>Disposable test fixture</p><h1>Development harness verification</h1><form><label for="name">Your name</label><input id="name" value="Director"><button>Greet</button></form><p id="result" role="status" aria-live="polite"></p><p>This tiny page verifies agent delivery, browser QA and human approval gates.</p></main>
<script type="module">import {greet} from './greeting.mjs';document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();document.querySelector('#result').textContent=greet(document.querySelector('#name').value)});</script></body></html>
